services:
  - type: web
    name: personal-email-assistant-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        value: https://personal-email-assistant-api.onrender.com/api/auth/callback
      - key: FRONTEND_URL
        value: https://personal-email-assistant-2.vercel.app
      - key: DB_PATH
        value: /tmp/emails.db
      - key: CHROMA_DB_PATH
        value: /tmp/chroma_db
